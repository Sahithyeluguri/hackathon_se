# AFTER: four zones joined by a router container running a default-deny nftables ruleset
x-hosts: &hosts
  - "ws:10.20.10.10"
  - "web:10.20.20.20"
  - "app:10.20.30.30"
  - "db:10.20.30.40"
  - "files:10.20.30.50"
  - "admin:10.20.99.60"
  - "router:10.20.99.254"
x-host: &host
  build: ./image
  image: flatland-lab
  cap_add: [NET_ADMIN, NET_RAW]
  volumes: ["./lab:/lab:ro"]
  extra_hosts: *hosts

services:
  router:
    <<: *host
    hostname: router
    environment: { ROLE: router, FW: "1" }
    sysctls: { net.ipv4.ip_forward: "1" }
    networks:
      user_net:   { ipv4_address: 10.20.10.254 }
      dmz_net:    { ipv4_address: 10.20.20.254 }
      server_net: { ipv4_address: 10.20.30.254 }
      mgmt_net:   { ipv4_address: 10.20.99.254 }
  ws:    { <<: *host, hostname: ws,    depends_on: [router], environment: { ROLE: ws,    GW: 10.20.10.254 }, networks: { user_net:   { ipv4_address: 10.20.10.10 } } }
  web:   { <<: *host, ports: ["127.0.0.1:8443:443"], hostname: web,   depends_on: [router], environment: { ROLE: web,   GW: 10.20.20.254 }, networks: { dmz_net:    { ipv4_address: 10.20.20.20 } } }
  app:   { <<: *host, hostname: app,   depends_on: [router], environment: { ROLE: app,   GW: 10.20.30.254 }, networks: { server_net: { ipv4_address: 10.20.30.30 } } }
  files: { <<: *host, hostname: files, depends_on: [router], environment: { ROLE: files, GW: 10.20.30.254 }, networks: { server_net: { ipv4_address: 10.20.30.50 } } }
  admin: { <<: *host, hostname: admin, depends_on: [router], environment: { ROLE: admin, GW: 10.20.99.254 }, networks: { mgmt_net:   { ipv4_address: 10.20.99.60 } } }
  db:
    build: ./db-image
    image: flatland-db
    hostname: db
    depends_on: [router]
    cap_add: [NET_ADMIN]
    volumes: ["./lab:/lab:ro", "./lab/conf/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    extra_hosts: *hosts
    environment: { POSTGRES_USER: appuser, POSTGRES_PASSWORD: AppDb2024, POSTGRES_DB: corp, GW: 10.20.30.254, MICROSEG: "${MICROSEG:-0}" }
    networks: { server_net: { ipv4_address: 10.20.30.40 } }

# NOTE: do not mark these "internal: true" - Docker's internal-network rules drop routed traffic.
networks:
  user_net:   { ipam: { config: [ { subnet: 10.20.10.0/24 } ] } }
  dmz_net:    { ipam: { config: [ { subnet: 10.20.20.0/24 } ] } }
  server_net: { ipam: { config: [ { subnet: 10.20.30.0/24 } ] } }
  mgmt_net:   { ipam: { config: [ { subnet: 10.20.99.0/24 } ] } }
