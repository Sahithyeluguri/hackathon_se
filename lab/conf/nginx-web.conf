server {
    listen 443 ssl;
    server_name web web.corp.lab localhost;
    ssl_certificate     /etc/ssl/certs/web.crt;
    ssl_certificate_key /etc/ssl/private/web.key;
    location = /web-health { default_type text/plain; return 200 "web ok\n"; }
    location / { proxy_pass http://app:8080/; proxy_connect_timeout 5s; proxy_read_timeout 10s; }
}
